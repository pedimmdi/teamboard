components:
  schemas:
    AttachmentMetadata:
      type: object
      properties:
        filename:
          type: string
        size:
          type: integer
      required:
      - filename
      - size
    CalendarEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        event_type:
          allOf:
          - $ref: '#/components/schemas/CalendarEventTypeEnum'
          readOnly: true
        starts_at:
          type: string
          format: date-time
          readOnly: true
        ends_at:
          type: string
          format: date-time
          readOnly: true
        all_day:
          type: boolean
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_by_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - all_day
      - created_at
      - created_by
      - created_by_email
      - description
