openapi: 3.0.3
info:
  title: TeamBoard API
  version: 1.0.0
  description: REST API documentation for TeamBoard. The API provides authentication,
    account management, workspace management, membership management, and workspace
    invitation workflows.
paths:
  /api/v1/accounts/email/resend/:
    post:
      operationId: v1_accounts_email_resend_create
      description: Requests a new verification email without revealing whether the
        email address is registered or already verified.
      summary: Resend email verification
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmail'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationEmailResponse'
          description: ''
        '400':
          description: Invalid request data.
        '429':
          description: Too many requests.
  /api/v1/accounts/email/verify/:
    post:
      operationId: v1_accounts_email_verify_create
      description: Verifies an email address using the supplied verification token.
        Verification requires an explicit POST request.
      summary: Verify email address
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerification'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
        '400':
          description: Invalid, expired, or already used verification data.
        '429':
          description: Too many requests.
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: Logs out the authenticated session.
      summary: Log out
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
        '400':
          description: Invalid logout request.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    patch:
      operationId: v1_accounts_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUser'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/accounts/password/change/:
    post:
      operationId: v1_accounts_password_change_create
      description: Changes the authenticated user's password. Existing sessions are
        invalidated after a successful change.
      summary: Change password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          description: Invalid request data or current password.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/accounts/password/reset/:
    post:
      operationId: v1_accounts_password_reset_create
      description: Requests password reset instructions. The response does not reveal
        whether the email exists.
      summary: Request password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
        '400':
          description: Invalid request data.
        '429':
          description: Too many requests.
  /api/v1/accounts/password/reset/confirm/:
    post:
      operationId: v1_accounts_password_reset_confirm_create
      description: Resets the password using a valid password-reset token and invalidates
        the user's existing sessions.
      summary: Confirm password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
        '400':
          description: Invalid, expired, or incomplete reset data.
        '429':
          description: Too many requests.
  /api/v1/accounts/refresh/:
    post:
      operationId: v1_accounts_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionRefreshToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionRefreshToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshToken'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: v1_accounts_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/accounts/sessions/:
    get:
      operationId: v1_accounts_sessions_list
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/accounts/sessions/{session_id}/:
    delete:
      operationId: v1_accounts_sessions_destroy
      description: Revokes a session belonging to the authenticated user.
      summary: Revoke a session
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        description: ID of the session to revoke.
        required: true
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
          description: ''
        '401':
          description: Authentication credentials are missing or invalid.
        '404':
          description: The session does not exist or does not belong to the user.
  /api/v1/accounts/sessions/revoke-others/:
    post:
      operationId: v1_accounts_sessions_revoke_others_create
      description: Revokes the authenticated user's other active sessions while keeping
        the current session active.
      summary: Revoke other sessions
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeOtherSessionsResponse'
          description: ''
        '400':
          description: The current token is not associated with a session.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/workspaces/:
    get:
      operationId: v1_workspaces_list
      description: Returns all workspaces that the authenticated user is a member
        of.
      summary: List workspaces
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaginatedWorkspaceList'
          description: ''
    post:
      operationId: v1_workspaces_create
      description: Creates a new workspace. The authenticated user automatically becomes
        the workspace owner.
      summary: Create workspace
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workspace'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Workspace'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Workspace'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/workspaces/{slug}/:
    get:
      operationId: v1_workspaces_retrieve
      description: Returns the details of an workspace that the authenticated user
        belongs to.
      summary: Retrieve workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '404':
          description: Workspace not found.
    patch:
      operationId: v1_workspaces_partial_update
      description: Updates an workspace's editable fields. Only workspace owners and
        admins can perform this operation.
      summary: Update workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspace'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspace'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspace'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '403':
          description: The authenticated user does not have permission to update the
            workspace.
        '404':
          description: Workspace not found.
    delete:
      operationId: v1_workspaces_destroy
      description: Permanently deletes the workspace and its related memberships and
        invitations. Only the workspace owner can perform this operation.
      summary: Delete workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Workspace deleted successfully.
        '403':
          description: Only the workspace owner can delete the workspace.
        '404':
          description: Workspace not found.
  /api/v1/workspaces/{slug}/invitations/:
    get:
      operationId: v1_workspaces_invitations_list
      description: Returns invitations for an workspace. Only workspace owners and
        admins can manage invitations.
      summary: List workspace invitations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Invitations
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaginatedWorkspaceInvitationList'
          description: ''
    post:
      operationId: v1_workspaces_invitations_create
      description: Creates an invitation for an email address. Only workspace owners
        and admins can invite users.
      summary: Create workspace invitation
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationCreate'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitation'
          description: ''
        '400':
          description: Invalid email, existing member, or active invitation.
        '403':
          description: The authenticated user cannot manage invitations.
        '404':
          description: Workspace not found.
  /api/v1/workspaces/{slug}/invitations/{invitation_id}/:
    delete:
      operationId: v1_workspaces_invitations_destroy
      description: Revokes a pending invitation. Only workspace owners and admins
        can revoke invitations.
      summary: Revoke workspace invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
        description: The UUID of the invitation.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Invitations
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Invitation revoked successfully.
        '400':
          description: The invitation is not pending or has already expired.
        '403':
          description: The authenticated user cannot manage invitations.
        '404':
          description: Workspace or invitation not found.
  /api/v1/workspaces/{slug}/invitations/{invitation_id}/resend/:
    post:
      operationId: v1_workspaces_invitations_resend_create
      description: Resends an invitation email with a newly generated token and renews
        its expiration date. Only workspace owners and admins can resend invitations.
      summary: Resend workspace invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Workspaces - Invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitation'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitation'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitation'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInvitation'
          description: ''
        '400':
          description: The invitation was accepted, revoked, or cannot be resent.
        '403':
          description: The authenticated user cannot manage invitations.
        '404':
          description: The workspace or invitation was not found.
        '429':
          description: The invitation rate limit was exceeded.
  /api/v1/workspaces/{slug}/leave/:
    post:
      operationId: v1_workspaces_leave_create
      description: Removes the authenticated user's membership from the workspace.
        Workspace owners cannot leave directly; they must transfer ownership or delete
        the workspace.
      summary: Leave workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Members
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Successfully left the workspace.
        '400':
          description: Workspace owners cannot leave the workspace.
        '404':
          description: Workspace or membership not found.
  /api/v1/workspaces/{slug}/members/:
    get:
      operationId: v1_workspaces_members_list
      description: Returns all members of the workspace. Any authenticated member
        of the workspace can view the list.
      summary: List workspace members
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Members
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaginatedWorkspaceMembershipList'
          description: ''
  /api/v1/workspaces/{slug}/members/{membership_id}/:
    delete:
      operationId: v1_workspaces_members_destroy
      description: Removes a member from the workspace without deleting the user's
        account. Owners can remove admins and members; admins can remove members only.
      summary: Remove workspace member
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
        description: The UUID of the membership to remove.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Members
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Member removed successfully.
        '400':
          description: The workspace owner cannot be removed.
        '403':
          description: The authenticated user does not have permission to remove this
            member.
        '404':
          description: Workspace or membership not found.
  /api/v1/workspaces/{slug}/members/{membership_id}/role/:
    patch:
      operationId: v1_workspaces_members_role_partial_update
      description: Changes an workspace's member role between admin and member. Only
        the workspace owner can change member roles. The owner's role cannot be changed
        through this endpoint.
      summary: Update member role
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
        description: The UUID of the membership.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMembershipRoleUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMembershipRoleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceMembershipRoleUpdate'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
          description: ''
        '400':
          description: Invalid role or attempt to change the owner's role.
        '403':
          description: Only the workspace owner can change member roles.
        '404':
          description: Workspace or membership not found.
  /api/v1/workspaces/{slug}/transfer-ownership/:
    post:
      operationId: v1_workspaces_transfer_ownership_create
      description: Transfers workspace ownership to another member. The current owner
        becomes an admin and the selected member becomes the new owner.
      summary: Transfer workspace ownership
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceOwnershipTransfer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceOwnershipTransfer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceOwnershipTransfer'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceMembership'
          description: ''
        '400':
          description: Invalid membership or ownership transfer request.
        '403':
          description: Only the workspace owner can transfer ownership.
        '404':
          description: Workspace or target membership not found.
  /api/v1/workspaces/invitations/accept/:
    post:
      operationId: v1_workspaces_invitations_accept_create
      description: Accepts an workspace invitation using its token and adds the authenticated
        user as a member of the workspace.
      summary: Accept workspace invitation
      tags:
      - Workspaces - Invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationAccept'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationAccept'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceInvitationAccept'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Invitation accepted successfully.
        '400':
          description: Invalid, expired, revoked, or otherwise unusable invitation.
        '401':
          description: Authentication is required.
components:
  schemas:
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
      - password_confirm
    ChangePasswordResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        date_joined:
          type: string
          format: date-time
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_email_verified
    EmailVerification:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
