  /api/v1/workspaces/{slug}/projects/{project_id}/tasks/:
    get:
      operationId: tasks_list
      summary: List project tasks
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
        description: Filter tasks by assignee. Accepts a valid user ID or the special
          value 'me' to filter tasks assigned to the authenticated user. The value
          'me' is case-sensitive. Cannot be combined with unassigned=true.
      - in: query
        name: due_before
        schema:
          type: string
          format: date
        description: 'Filter tasks with a due date strictly before the specified date
          (exclusive). Format: YYYY-MM-DD. Tasks without a due date are excluded.
          Example: due_before=2027-03-20.'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Order by created_at, updated_at, due_date, title, priority,
          status, or position. Prefix with ''-'' for descending order. Default: -created_at.
          Priority ordering follows low, medium, high, urgent. Status ordering follows
          todo, in_progress, in_review, done. Tasks without a due_date always appear
          last when ordering by due_date.'
      - in: query
        name: overdue
        schema:
          type: boolean
        description: 'Filter overdue tasks. When true, return only tasks with a due
          date strictly before today''s date that are not done. When false, do not
          apply the overdue filter. Accepted values: true, false (case-insensitive).
          Example: overdue=true.'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
          - urgent
        description: Filter tasks by priority.
      - in: path
        name: project_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive search in title and description. Maximum 200
          characters.
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: status
        schema:
          type: string
        description: 'Filter tasks by one or more comma-separated statuses. Allowed
          values: todo, in_progress, in_review, done. Example: status=todo,done.'
      - in: query
        name: unassigned
        schema:
          type: boolean
        description: Use true to return only unassigned tasks. Cannot be combined
          with assignee.
      tags:
      - Tasks
      security:
      - BearerAuth: []
      responses:
