openapi: 3.0.3
info:
  title: TeamBoard API
  version: 1.0.0
  description: REST API documentation for TeamBoard. The API provides authentication,
    account management, organization management, membership management, and organization
    invitation workflows.
paths:
  /api/v1/accounts/email/resend/:
    post:
      operationId: v1_accounts_email_resend_create
      description: Requests a new verification email without revealing whether the
        email address is registered or already verified.
      summary: Resend email verification
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmail'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationEmailResponse'
          description: ''
        '400':
          description: Invalid request data.
        '429':
          description: Too many requests.
  /api/v1/accounts/email/verify/:
    get:
      operationId: v1_accounts_email_verify_retrieve
      description: Verifies an email address using the supplied verification token.
      summary: Verify email address
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Email verification token.
        required: true
      - in: query
        name: uid
        schema:
          type: string
        description: Encoded user identifier.
        required: true
      tags:
      - v1
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
        '400':
          description: Invalid or expired verification data.
        '429':
          description: Too many requests.
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Login'
          description: ''
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: Logs out the authenticated session.
      summary: Log out
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
        '400':
          description: Invalid logout request.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    patch:
      operationId: v1_accounts_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUser'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/v1/accounts/password/change/:
    post:
      operationId: v1_accounts_password_change_create
      description: Changes the authenticated user's password. Existing sessions are
        invalidated after a successful change.
      summary: Change password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          description: Invalid request data or current password.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/accounts/password/reset/:
    post:
      operationId: v1_accounts_password_reset_create
      description: Requests password reset instructions. The response does not reveal
        whether the email exists.
      summary: Request password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
        '400':
          description: Invalid request data.
        '429':
          description: Too many requests.
  /api/v1/accounts/password/reset/confirm/:
    post:
      operationId: v1_accounts_password_reset_confirm_create
      description: Resets the password using a valid password-reset token and invalidates
        the user's existing sessions.
      summary: Confirm password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
        '400':
          description: Invalid, expired, or incomplete reset data.
        '429':
          description: Too many requests.
  /api/v1/accounts/refresh/:
    post:
      operationId: v1_accounts_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshToken'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionRefreshToken'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionRefreshToken'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshToken'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: v1_accounts_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/accounts/sessions/:
    get:
      operationId: v1_accounts_sessions_list
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/accounts/sessions/{session_id}/:
    delete:
      operationId: v1_accounts_sessions_destroy
      description: Revokes a session belonging to the authenticated user.
      summary: Revoke a session
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        description: ID of the session to revoke.
        required: true
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
          description: ''
        '401':
          description: Authentication credentials are missing or invalid.
        '404':
          description: The session does not exist or does not belong to the user.
  /api/v1/accounts/sessions/revoke-others/:
    post:
      operationId: v1_accounts_sessions_revoke_others_create
      description: Revokes the authenticated user's other active sessions while keeping
        the current session active.
      summary: Revoke other sessions
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeOtherSessionsResponse'
          description: ''
        '400':
          description: The current token is not associated with a session.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/organizations/:
    get:
      operationId: v1_organizations_list
      description: Returns all organizations that the authenticated user is a member
        of.
      summary: List organizations
      tags:
      - Organizations
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
          description: ''
    post:
      operationId: v1_organizations_create
      description: Creates a new organization. The authenticated user automatically
        becomes the organization owner.
      summary: Create organization
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Organization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Organization'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
  /api/v1/organizations/{slug}/:
    get:
      operationId: v1_organizations_retrieve
      description: Returns the details of an organization that the authenticated user
        belongs to.
      summary: Retrieve organization
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '404':
          description: Organization not found.
    patch:
      operationId: v1_organizations_partial_update
      description: Updates an organization's editable fields. Only organization owners
        and admins can perform this operation.
      summary: Update organization
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '403':
          description: The authenticated user does not have permission to update the
            organization.
        '404':
          description: Organization not found.
    delete:
      operationId: v1_organizations_destroy
      description: Permanently deletes the organization and its related memberships
        and invitations. Only the organization owner can perform this operation.
      summary: Delete organization
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Organization deleted successfully.
        '403':
          description: Only the organization owner can delete the organization.
        '404':
          description: Organization not found.
  /api/v1/organizations/{slug}/invitations/:
    get:
      operationId: v1_organizations_invitations_list
      description: Returns invitations for an organization. Only organization owners
        and admins can manage invitations.
      summary: List organization invitations
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Invitations
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationInvitation'
          description: ''
    post:
      operationId: v1_organizations_invitations_create
      description: Creates an invitation for an email address. Only organization owners
        and admins can invite users.
      summary: Create organization invitation
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationCreate'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvitation'
          description: ''
        '400':
          description: Invalid email, existing member, or active invitation.
        '403':
          description: The authenticated user cannot manage invitations.
        '404':
          description: Organization not found.
  /api/v1/organizations/{slug}/invitations/{invitation_id}/:
    delete:
      operationId: v1_organizations_invitations_destroy
      description: Revokes a pending invitation. Only organization owners and admins
        can revoke invitations.
      summary: Revoke organization invitation
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
        description: The UUID of the invitation.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Invitations
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Invitation revoked successfully.
        '400':
          description: The invitation is not pending or has already expired.
        '403':
          description: The authenticated user cannot manage invitations.
        '404':
          description: Organization or invitation not found.
  /api/v1/organizations/{slug}/leave/:
    post:
      operationId: v1_organizations_leave_create
      description: Removes the authenticated user's membership from the organization.
        Organization owners cannot leave directly; they must transfer ownership or
        delete the organization.
      summary: Leave organization
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Members
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Successfully left the organization.
        '400':
          description: Organization owners cannot leave the organization.
        '404':
          description: Organization or membership not found.
  /api/v1/organizations/{slug}/members/:
    get:
      operationId: v1_organizations_members_list
      description: Returns all members of the organization. Any authenticated member
        of the organization can view the list.
      summary: List organization members
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Members
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationMembership'
          description: ''
  /api/v1/organizations/{slug}/members/{membership_id}/:
    delete:
      operationId: v1_organizations_members_destroy
      description: Removes a member from the organization without deleting the user's
        account. Owners can remove admins and members; admins can remove members only.
      summary: Remove organization member
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
        description: The UUID of the membership to remove.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Members
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Member removed successfully.
        '400':
          description: The organization owner cannot be removed.
        '403':
          description: The authenticated user does not have permission to remove this
            member.
        '404':
          description: Organization or membership not found.
  /api/v1/organizations/{slug}/members/{membership_id}/role/:
    patch:
      operationId: v1_organizations_members_role_partial_update
      description: Changes an organization's member role between admin and member.
        Only the organization owner can change member roles. The owner's role cannot
        be changed through this endpoint.
      summary: Update member role
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
        description: The UUID of the membership.
        required: true
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMembershipRoleUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMembershipRoleUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationMembershipRoleUpdate'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
          description: ''
        '400':
          description: Invalid role or attempt to change the owner's role.
        '403':
          description: Only the organization owner can change member roles.
        '404':
          description: Organization or membership not found.
  /api/v1/organizations/{slug}/transfer-ownership/:
    post:
      operationId: v1_organizations_transfer_ownership_create
      description: Transfers organization ownership to another member. The current
        owner becomes an admin and the selected member becomes the new owner.
      summary: Transfer organization ownership
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the organization.
        required: true
      tags:
      - Organizations - Members
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationOwnershipTransfer'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationOwnershipTransfer'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationOwnershipTransfer'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembership'
          description: ''
        '400':
          description: Invalid membership or ownership transfer request.
        '403':
          description: Only the organization owner can transfer ownership.
        '404':
          description: Organization or target membership not found.
  /api/v1/organizations/invitations/accept/:
    post:
      operationId: v1_organizations_invitations_accept_create
      description: Accepts an organization invitation using its token and adds the
        authenticated user as a member of the organization.
      summary: Accept organization invitation
      tags:
      - Organizations - Invitations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationAccept'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationAccept'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationInvitationAccept'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Invitation accepted successfully.
        '400':
          description: Invalid, expired, revoked, or otherwise unusable invitation.
        '401':
          description: Authentication is required.
components:
  schemas:
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
      required:
      - current_password
      - new_password
      - password_confirm
    ChangePasswordResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        date_joined:
          type: string
          format: date-time
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
      required:
      - date_joined
      - email
      - id
      - is_email_verified
    EmailVerificationResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Login:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LogoutResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 150
        slug:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
      - updated_at
    OrganizationInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        invited_by_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        accepted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        revoked_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - accepted_at
      - created_at
      - email
      - expires_at
      - id
      - invited_by_email
      - revoked_at
      - status
    OrganizationInvitationAccept:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          maxLength: 200
      required:
      - token
    OrganizationInvitationCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    OrganizationMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_email:
