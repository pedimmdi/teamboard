openapi: 3.0.3
info:
  title: TeamBoard API
  version: 1.0.0
  description: REST API documentation for TeamBoard. The API provides authentication,
    account management, workspace management, membership management, and workspace
    invitation workflows.
paths:
  /api/v1/accounts/email/resend/:
    post:
      operationId: v1_accounts_email_resend_create
      description: Requests a new verification email without revealing whether the
        email address is registered or already verified.
      summary: Resend email verification
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationEmailRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendVerificationEmailResponse'
          description: ''
        '400':
          description: Invalid request data.
        '429':
          description: Too many requests.
  /api/v1/accounts/email/verify/:
    post:
      operationId: v1_accounts_email_verify_create
      description: Verifies an email address using the supplied verification token.
        Verification requires an explicit POST request.
      summary: Verify email address
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationResponse'
          description: ''
        '400':
          description: Invalid, expired, or already used verification data.
        '429':
          description: Too many requests.
  /api/v1/accounts/login/:
    post:
      operationId: v1_accounts_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/accounts/logout/:
    post:
      operationId: v1_accounts_logout_create
      description: Logs out the authenticated session.
      summary: Log out
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
        '400':
          description: Invalid logout request.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/accounts/me/:
    get:
      operationId: v1_accounts_me_retrieve
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
    patch:
      operationId: v1_accounts_me_partial_update
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurrentUserRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
        '429':
          description: Profile image upload rate exceeded.
  /api/v1/accounts/password/change/:
    post:
      operationId: v1_accounts_password_change_create
      description: Changes the authenticated user's password. Existing sessions are
        invalidated after a successful change.
      summary: Change password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          description: Invalid request data or current password.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/accounts/password/reset/:
    post:
      operationId: v1_accounts_password_reset_create
      description: Requests password reset instructions. The response does not reveal
        whether the email exists.
      summary: Request password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequestResponse'
          description: ''
        '400':
          description: Invalid request data.
        '429':
          description: Too many requests.
  /api/v1/accounts/password/reset/confirm/:
    post:
      operationId: v1_accounts_password_reset_confirm_create
      description: Resets the password using a valid password-reset token and invalidates
        the user's existing sessions.
      summary: Confirm password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetConfirmResponse'
          description: ''
        '400':
          description: Invalid, expired, or incomplete reset data.
        '429':
          description: Too many requests.
  /api/v1/accounts/refresh/:
    post:
      operationId: v1_accounts_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionRefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionRefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionRefreshTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRefreshToken'
          description: ''
  /api/v1/accounts/register/:
    post:
      operationId: v1_accounts_register_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/v1/accounts/sessions/:
    get:
      operationId: v1_accounts_sessions_list
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSession'
          description: ''
  /api/v1/accounts/sessions/{session_id}/:
    delete:
      operationId: v1_accounts_sessions_destroy
      description: Revokes a session belonging to the authenticated user.
      summary: Revoke a session
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
        description: ID of the session to revoke.
        required: true
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRevokeResponse'
          description: ''
        '401':
          description: Authentication credentials are missing or invalid.
        '404':
          description: The session does not exist or does not belong to the user.
  /api/v1/accounts/sessions/revoke-others/:
    post:
      operationId: v1_accounts_sessions_revoke_others_create
      description: Revokes the authenticated user's other active sessions while keeping
        the current session active.
      summary: Revoke other sessions
      tags:
      - v1
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokeOtherSessionsResponse'
          description: ''
        '400':
          description: The current token is not associated with a session.
        '401':
          description: Authentication credentials are missing or invalid.
  /api/v1/notifications/:
    get:
      operationId: notifications_list
      summary: List my notifications
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: read
        schema:
          type: boolean
        description: Filter notifications by read status. true = read, false = unread.
      tags:
      - Notifications
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
  /api/v1/notifications/{id}/accept-invitation/:
    post:
      operationId: v1_notifications_accept_invitation_create
      summary: Accept a workspace invitation from the inbox
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Notifications
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/notifications/{id}/mark-read/:
    post:
      operationId: notifications_mark_read
      summary: Mark one notification as read
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Notifications
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
  /api/v1/notifications/mark-all-read/:
    post:
      operationId: notifications_mark_all_read
      summary: Mark all accessible notifications as read
      tags:
      - Notifications
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationMarkAllReadResponse'
          description: ''
  /api/v1/notifications/unread-count/:
    get:
      operationId: notifications_unread_count
      summary: Count my unread notifications
      tags:
      - Notifications
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
                required:
                - unread_count
          description: ''
  /api/v1/workspaces/:
    get:
      operationId: v1_workspaces_list
      description: Returns all workspaces that the authenticated user is a member
        of.
      summary: List workspaces
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspace'
          description: ''
    post:
      operationId: v1_workspaces_create
      description: Creates a new workspace. The authenticated user automatically becomes
        the workspace owner.
      summary: Create workspace
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkspaceRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
  /api/v1/workspaces/{slug}/:
    get:
      operationId: v1_workspaces_retrieve
      description: Returns the details of an workspace that the authenticated user
        belongs to.
      summary: Retrieve workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '404':
          description: Workspace not found.
    patch:
      operationId: v1_workspaces_partial_update
      description: Updates an workspace's editable fields. Only workspace owners and
        admins can perform this operation.
      summary: Update workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkspaceRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
          description: ''
        '403':
          description: The authenticated user does not have permission to update the
            workspace.
        '404':
          description: Workspace not found.
    delete:
      operationId: v1_workspaces_destroy
      description: Permanently deletes the workspace and its related memberships and
        invitations. Only the workspace owner can perform this operation.
      summary: Delete workspace
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Workspace deleted successfully.
        '403':
          description: Only the workspace owner can delete the workspace.
        '404':
          description: Workspace not found.
  /api/v1/workspaces/{slug}/calendar/:
    get:
      operationId: calendar_workspace_events_list
      summary: List accessible workspace calendar events
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        description: Exclusive range end (ISO 8601).
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - deadline
          - event
          - meeting
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        description: Inclusive range start (ISO 8601).
      tags:
      - Calendars
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCalendarEventList'
          description: ''
  /api/v1/workspaces/{slug}/calendar/timeline/:
    get:
      operationId: workspace_calendar_timeline_list
      summary: Get workspace calendar timeline
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date-time
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date-time
        required: true
      tags:
      - Calendars
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarTimelineResponse'
          description: ''
  /api/v1/workspaces/{slug}/chats/{conversation_id}/messages/:
    get:
      operationId: v1_workspaces_chats_messages_list
      summary: List conversation messages
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Chats
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChatMessageList'
          description: ''
    post:
      operationId: v1_workspaces_chats_messages_create
      summary: Send a message with optional attachments
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Chats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChatMessageCreateRequest'
      security:
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: ''
  /api/v1/workspaces/{slug}/chats/{conversation_id}/messages/{message_id}/:
    patch:
      operationId: v1_workspaces_chats_messages_partial_update
      summary: Edit own message
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Chats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChatMessageUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChatMessageUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChatMessageUpdateRequest'
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
          description: ''
    delete:
      operationId: v1_workspaces_chats_messages_destroy
      summary: Soft-delete own message
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Chats
      security:
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/workspaces/{slug}/chats/{conversation_id}/messages/{message_id}/attachments/{attachment_id}/:
    get:
      operationId: v1_workspaces_chats_messages_attachments_retrieve
      summary: Download a private chat attachment
      parameters:
      - in: path
        name: attachment_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: message_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Chats
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/workspaces/{slug}/chats/direct/:
    get:
      operationId: v1_workspaces_chats_direct_list
      summary: List own direct conversations
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Chats
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
    post:
      operationId: v1_workspaces_chats_direct_create
      summary: Start or retrieve a direct conversation
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - Chats
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DirectCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DirectCreateRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
  /api/v1/workspaces/{slug}/invitations/:
    get:
      operationId: v1_workspaces_invitations_list
      description: Returns invitations for an workspace. Only workspace owners and
        admins can manage invitations.
      summary: List workspace invitations
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: path
        name: slug
        schema:
          type: string
        description: The unique slug of the workspace.
        required: true
      tags:
      - Workspaces - Invitations
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkspaceInvitation'
          description: ''
    post:
      operationId: v1_workspaces_invitations_create
