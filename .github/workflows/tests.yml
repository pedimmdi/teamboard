name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: teamboard
          POSTGRES_USER: teamboard
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamboard -d teamboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ci.txt

      - name: Validate backend production deployment
        run: APP_ENV_FILE=.env.example docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.production.yml config --quiet

      - name: Build non-root backend image
        run: |
          docker build -f docker/backend.Dockerfile -t teamboard-ci .
          docker run --rm --entrypoint python teamboard-ci -c "import os; assert os.getuid() == 10001"

      - name: Run backend tests
        working-directory: config
        env:
          SECRET_KEY: ci-test-secret-key-for-teamboard-tests-only
          POSTGRES_DB: teamboard
          POSTGRES_USER: teamboard
          POSTGRES_PASSWORD: test-password
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          FRONTEND_URL: http://localhost:3000
          RUN_REDIS_TESTS: "1"
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_CACHE_URL: redis://127.0.0.1:6379/1
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
          python -m coverage run -m pytest -v

      - name: Check coverage of core backend apps
        working-directory: config
        run: python -m coverage report --include="accounts/*,background/*,projects/*,tasks/*,workspaces/*" --fail-under=85

      - name: Generate backend coverage reports
        if: ${{ !cancelled() }}
        working-directory: config
        run: |
          python -m coverage report
          python -m coverage xml

      - name: Upload backend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: config/coverage.xml

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Run frontend tests with coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage/lcov.info

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Python audit tool
        run: python -m pip install -r requirements-ci.txt

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-ci.txt --format=json --output=artifacts/python-audit.json

      - name: Audit npm dependencies
        if: ${{ !cancelled() }}
        working-directory: client
        run: npm audit --audit-level=moderate --json > ../artifacts/npm-audit.json

      - name: Upload dependency audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: |
            artifacts/python-audit.json
            artifacts/npm-audit.json

  browser:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: teamboard_e2e
          POSTGRES_USER: teamboard
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamboard -d teamboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5


    env:
      SECRET_KEY: browser-test-secret-key-for-teamboard-tests-only
      POSTGRES_DB: teamboard_e2e
      POSTGRES_USER: teamboard
      POSTGRES_PASSWORD: test-password
      POSTGRES_HOST: 127.0.0.1
      E2E_PASSWORD: Browser-test-password-2026!
      REFRESH_TOKEN_COOKIE_SECURE: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: client/test-results/
